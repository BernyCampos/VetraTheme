name: Validate and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: dom, fileinfo, intl, mbstring, pdo_sqlite, sodium, zip
          tools: composer

      - name: Install dependencies
        run: npm ci

      - name: Build theme
        run: npm run build

      - name: Run Node.js tests
        run: npm test

      - name: Validate PHP syntax
        run: find src config lang tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run appearance tests
        run: php tests/appearance.php

      - name: Generate release packages
        run: python scripts/package.py --repository "${{ github.repository }}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vetra-theme-release-candidate
          path: build/
