name: Feature request
description: Suggest an improvement that fits a theme plugin
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Explain how it preserves Pelican's native features and permissions.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: The proposal does not require changes to Pelican core.
          required: true
        - label: The proposal does not simulate an operational feature.
          required: true
