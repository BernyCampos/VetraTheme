name: Reporte de error
description: Informa un problema reproducible de VetraTheme
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: No publiques secretos. Para vulnerabilidades usa SECURITY.md.
  - type: input
    id: vetra
    attributes:
      label: Versión de VetraTheme
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: pelican
    attributes:
      label: Versión de Pelican
      placeholder: 1.0.0-rc.2
    validations:
      required: true
  - type: dropdown
    id: panel
    attributes:
      label: Panel afectado
      options: [admin, app, server, ajustes, instalación]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      description: Incluye el mínimo necesario.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Resultado esperado y resultado real
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Registros saneados
      description: Elimina tokens, cookies, claves, IP privadas y datos personales.
