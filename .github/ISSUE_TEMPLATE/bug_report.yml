name: Bug report
description: Report a reproducible Vetra Theme problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not publish secrets. Use SECURITY.md for vulnerabilities.
  - type: input
    id: vetra
    attributes:
      label: Vetra Theme version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: pelican
    attributes:
      label: Pelican version
      placeholder: 1.0.0-rc.2
    validations:
      required: true
  - type: dropdown
    id: panel
    attributes:
      label: Affected area
      options: [admin, app, server, settings, installation]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest reproducible sequence.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove tokens, cookies, keys, private IP addresses, and personal data.
